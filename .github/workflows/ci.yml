name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (install, build, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_portal?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_portal_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run backend unit tests
        run: npm test

      - name: Create test database
        run: psql -h localhost -U postgres -d employee_portal -c "CREATE DATABASE employee_portal_test;"
        env:
          PGPASSWORD: postgres

      - name: Run migrations (dev + test DBs)
        run: |
          npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Run e2e / integration tests
        run: npm run test:e2e

      - name: Run API suite (Newman)
        run: |
          npm run db:seed
          ADMIN_PASSWORD="Admin@12345" ADMIN_EMAIL="admin@example.com" npm run db:seed:admin
          node dist/main.js &
          sleep 5
          npm run test:api

      - name: Upload Newman results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: backend/postman
          if-no-files-found: ignore
